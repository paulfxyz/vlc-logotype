<style>
:root{--r:18px;--or:#FF7A00;--or2:#FF9A3C;--hdr:64px}

[data-theme=light]{--bg:#F6F4F1;--bg2:#EFECE7;--panel:#FFFFFF;--panel2:#F4F2EE;--line:#E4E0D9;--line2:#D3CEC5;--text:#18181B;--mute:#5F5F68;--art:radial-gradient(120% 90% at 50% 0%,#FFFFFF,#ECE8E2);--glass:rgba(246,244,241,.82);--tagb:#FFD2A6;--chip-on:#111;--shadow:0 16px 40px rgba(40,30,20,.10);--or2:#D95F00;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:var(--hdr)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
a{color:var(--or2)}
.wrap{max-width:1280px;margin:0 auto;padding-left:32px;padding-right:32px}
.ic{width:20px;height:20px;display:block}
/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;height:var(--hdr);background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--line)}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;letter-spacing:-.01em;font-size:18px;white-space:nowrap}
.brand img{width:34px;height:34px}
.brand .pill{font-size:12px;font-weight:700;color:var(--or2);border:1px solid var(--tagb);border-radius:999px;padding:2px 8px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{color:var(--mute);text-decoration:none;font-size:15px;font-weight:500;padding:8px 12px;border-radius:10px}
.nav a:hover{color:var(--text);background:var(--panel2)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer;text-decoration:none}
.ibtn:hover{border-color:var(--line2)}
.ibtn .ghl{display:block;line-height:20px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:0 30px 0 34px;cursor:pointer}
.lang .globe{position:absolute;left:10px;top:9px;pointer-events:none;color:var(--mute)}
.lang .car{position:absolute;right:10px;top:15px;pointer-events:none;border:4px solid transparent;border-top-color:var(--mute)}
[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
[data-theme=light] .sun{display:none}[data-theme=light] .moon{display:block}
/* ---------- hero ---------- */
.hero{padding-top:72px;padding-bottom:40px}
.eyebrow{color:var(--or2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.04;margin:12px 0 18px;letter-spacing:-.025em;max-width:900px}
.lede{color:var(--mute);max-width:780px;font-size:19px;margin:0}
.hint{margin:16px 0 0;font-size:15px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.hint i{flex:0 0 8px;width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--or);display:inline-block}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;display:flex;align-items:baseline;gap:8px}
.stat b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat span{color:var(--mute);font-size:14px}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 0}
.why div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.why b{display:block;margin-bottom:4px}.why span{color:var(--mute);font-size:15px}
/* ---------- filter bar ---------- */
.bar{position:sticky;top:var(--hdr);z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;align-items:center;padding-top:12px;padding-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed=true]{background:var(--or);border-color:var(--or);color:var(--chip-on);font-weight:600}
.chip.sep{margin-left:6px}
.right{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.sort{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.status{font-size:13px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}
.status.off i{background:#A1A1AA}
/* ---------- grid ---------- */
main{padding-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding:0 0 32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;cursor:pointer}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.voted{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.art{aspect-ratio:1;border-radius:16px;background:var(--art);display:grid;place-items:center;position:relative;overflow:hidden}
.art img{width:72%;height:72%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover .art img{transform:scale(1.05)}
.art .num{position:absolute;top:12px;left:14px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.art .heart{position:absolute;top:10px;right:12px;font-size:12px;background:var(--or);color:#111;border-radius:999px;padding:3px 10px;font-weight:700;opacity:0;transform:scale(.8);transition:.2s}
.card.voted .heart{opacity:1;transform:none}
.sizes{display:flex;gap:10px;align-items:flex-end;justify-content:center;padding:4px 0 0}
.sizes img{display:block}
.meta h3{margin:0;font-size:19px;letter-spacing:-.01em;line-height:1.25}
.meta p{margin:6px 0 0;color:var(--mute);font-size:14.5px;line-height:1.5}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--or2);border:1px solid var(--tagb);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--line2)}
.btn.vote{background:var(--or);border-color:var(--or);color:#111}
.card.voted .btn.vote,.btn.vote.on{background:transparent;color:var(--or2)}
.count{font-variant-numeric:tabular-nums}
.bar-meter{height:4px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar-meter i{display:block;height:100%;background:var(--or);width:0;transition:width .5s}
.empty{grid-column:1/-1;color:var(--mute);padding:40px 0;text-align:center}
/* ---------- preview dialog ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(1180px,96vw);width:100%;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.pv{background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.pv-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-head img{width:52px;height:52px}
.pv-head .t{flex:1;min-width:220px}
.pv-head h2{margin:0;font-size:22px}.pv-head p{margin:2px 0 0;color:var(--mute);font-size:14px}
.pv-actions{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;padding:14px 22px 0;flex-wrap:wrap}
.pv-body{padding:16px 22px 24px}
.x,.navb{background:var(--panel2);border:1px solid var(--line);color:var(--text);height:40px;min-width:40px;border-radius:12px;font-size:18px;cursor:pointer}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--mute);align-items:center}
.dl a{border:1px solid var(--line);border-radius:10px;padding:5px 10px;text-decoration:none}
.tip2{margin:12px 0 0;color:var(--mute);font-size:13.5px}
%%MOCKCSS%%
section.blk{padding:40px 0 40px}
section.blk h2{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
section.blk>p,.blk .sub{color:var(--mute);margin:0 0 18px;max-width:780px}
.alldock{overflow-x:auto;padding-bottom:6px}
.alldock .mock{min-width:760px;aspect-ratio:auto;height:400px}
.alldock .dock{gap:6px;flex-wrap:wrap;justify-content:center;width:min(94%,1080px)}.alldock .dock .it{width:40px;height:40px}.alldock .dock .it.hl{width:40px;height:40px;margin:0}
.links{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lk{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--text)}
.lk:hover{border-color:var(--or)}.lk b{font-size:16px}.lk span{color:var(--mute);font-size:13.5px}

.ibtn.votes{border-color:var(--tagb);color:var(--or2)}
.ibtn.votes span,.ibtn.votes b{font-variant-numeric:tabular-nums;line-height:20px}.ibtn.votes b{display:none}
.pod .pi{display:flex;flex-direction:column;gap:10px}
.podgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;max-width:980px}
.pod{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.pod:hover{border-color:var(--or);transform:translateY(-2px)}
.pod.r1{padding-top:30px;border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset,var(--shadow)}
.pod .rank{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line2);color:var(--text)}
.pod.r1 .rank{background:var(--or);border-color:var(--or);color:#111;width:38px;height:38px;top:-19px;font-size:17px}
.pod .art{aspect-ratio:1;border-radius:16px;background:var(--art);display:grid;place-items:center}
.pod .art img{width:70%;height:70%}
.pod.r1 .art img{width:78%;height:78%}
.pod .art span{font-size:44px;color:var(--line2);font-weight:800}
.pod h4{margin:0;font-size:16px;line-height:1.3}
.pod .pv2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pod .pv2 b{font-size:18px}.pod .pv2 span{color:var(--mute);font-size:13px}
.pod.wait{cursor:default;opacity:.7}.pod.wait:hover{transform:none;border-color:var(--line)}
.how{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 28px}
.how h3{margin:0 0 16px;font-size:21px}
.how ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.how li{counter-increment:s;display:flex;flex-direction:column;gap:6px}
.how li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--or);color:#111;font-weight:800;font-size:14px;display:grid;place-items:center;margin-bottom:4px}
.how li b{font-size:15.5px}.how li span{color:var(--mute);font-size:14.5px}
.ledger{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ledger code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);word-break:break-all}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:1100px){.how ol{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.podgrid{grid-template-columns:1fr;gap:22px}.pod,.pod.r1{flex-direction:row;align-items:center;gap:14px;padding:14px}.pod.r1{order:-1}.pod .art{flex:0 0 76px;width:76px}.pod .pi{flex:1;min-width:0;gap:6px}.pod .rank{left:14px;transform:none;top:-12px}.pod.r1 .rank{top:-16px}.pod .art span{font-size:28px}.how{padding:20px}.how ol{grid-template-columns:1fr}.ibtn.votes span{display:none}.ibtn.votes b{display:block}}
/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line);background:var(--bg2);margin-top:20px}
.ftr .top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px;padding-top:48px;padding-bottom:36px}
.ftr .brand{margin-bottom:12px}
.ftr p{color:var(--mute);font-size:14.5px;margin:0 0 14px;max-width:380px}
.ftr h4{margin:4px 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ftr li a{color:var(--text);text-decoration:none;font-size:15px}
.ftr li a:hover{color:var(--or2)}
.ftr .bottom{border-top:1px solid var(--line);padding:18px 0 28px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
.ftr .bottom a{color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mute);text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){.why{grid-template-columns:1fr 1fr}.links{grid-template-columns:repeat(3,1fr)}.nav{display:none}}
@media (max-width:760px){
  :root{--hdr:58px}.wrap{padding-left:16px;padding-right:16px}
  .brand span.name{display:none}.brand .pill{display:none}.ibtn .ghl{display:none}
  .hero{padding-top:36px;padding-bottom:24px}.lede{font-size:17px}.stat{padding:10px 14px}.stat b{font-size:21px}
  .why{grid-template-columns:1fr 1fr;gap:10px}.why div{padding:14px}.why span{font-size:13px}
  .bar .wrap{flex-direction:column;align-items:stretch;gap:10px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.status{display:none}.right .sort{width:100%}
  .grid{grid-template-columns:1fr 1fr;gap:12px}.card{padding:12px;border-radius:18px}.sizes,.meta p,.tag{display:none}.meta h3{font-size:15px}.row{flex-direction:column}.btn{padding:9px;font-size:13.5px}
  .cmp{grid-template-columns:1fr}.mock{aspect-ratio:auto;height:320px}.mac .dock .it{width:42px;height:42px}.mac .dock .it.hl{width:56px;height:56px;margin-top:-14px}.mac .tip{bottom:82px}
  .links{grid-template-columns:1fr 1fr}.ftr .top{grid-template-columns:1fr 1fr;gap:26px}.ftr .top>div:first-child{grid-column:1/-1}
}
body.shot{background:#0E0E10;color:#F4F4F5}
body.shot .shotwrap{width:1600px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
body.shot .shotwrap .full{grid-column:1/-1}
body.shot h2{margin:0;font-size:30px}
body.shot .lbl,body.shot .cap{color:#A1A1AA}
</style>

const total = () => Object.values(COUNTS).reduce((a,b)=>a+b,0);
function renderStatus(){ const s=$('#status'); if(!s) return; s.classList.toggle('off', ONLINE===false); s.innerHTML = `<i></i>${ONLINE===null?t('st_load'):ONLINE?t('st_live',{n:total()}):t('st_off')}`; }
async function loadCounts(){
  try{ const r = await fetch(API+'?voter='+encodeURIComponent(VOTER)+'&t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; const j = await r.json(); COUNTS = j.counts||{}; if(j.mine) MINE=new Set(j.mine); ONLINE = true; }
  catch(e){ ONLINE = false; COUNTS = {}; MINE.forEach(id=>COUNTS[id]=1); }
  await loadMeta(); renderStatus();
}
async function toggleVote(id){
  const on = !MINE.has(id);
  on ? MINE.add(id) : MINE.delete(id);
  COUNTS[id] = Math.max(0,(COUNTS[id]||0)+(on?1:-1));
  renderCards(); toast(on?t('toast_on',{id}):t('toast_off',{id}));
  try{ const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,voter:VOTER,action:on?'add':'remove'})}); if(r.ok){const j=await r.json(); COUNTS=j.counts||COUNTS; if(j.mine) MINE=new Set(j.mine); ONLINE=true;} }catch(e){}
  await loadMeta(); renderCards(); renderStatus(); if($('#pv').open) openPreview(CUR);
}
let tt; function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}

const HOL=['Religious','National','Seasonal'];
let FILTER='All', SORT='num';
function renderFilters(){
  const design=[...new Set(ICONS.map(d=>d.tag).filter(x=>!HOL.includes(x)))];
  const chip=(k,label,cls='')=>`<button class="chip ${cls}" data-filter="${k}" aria-pressed="${FILTER===k}">${esc(label)}</button>`;
  $('#chips').innerHTML = chip('All',t('all')) + design.map(x=>chip(x,tg(x))).join('') + chip('Holidays',t('holidays'),'sep') + HOL.map(x=>chip(x,tg(x))).join('') + chip('Mine',t('mine'),'sep');
}
function renderCards(){
  const max = Math.max(1,...Object.values(COUNTS));
  let list = ICONS.filter(d=>FILTER==='All'||d.tag===FILTER||(FILTER==='Holidays'&&HOL.includes(d.tag))||(FILTER==='Mine'&&MINE.has(d.id)));
  if(SORT==='votes') list=[...list].sort((a,b)=>(COUNTS[b.id]||0)-(COUNTS[a.id]||0));
  $('#grid').innerHTML = list.map(d=>{const c=COUNTS[d.id]||0, n=esc(nm(d));return `
  <article class="card ${MINE.has(d.id)?'voted':''}" data-open="${d.id}" tabindex="0" aria-label="#${d.id} ${n}">
    <div class="art"><span class="num">#${d.id}</span><span class="heart">${t('your_vote')}</span><img alt="${n}" src="${IC(d.id,'macos')}" loading="lazy"></div>
    <div class="sizes"><img alt="" src="${IC(d.id,'macos')}" width="64" height="64"><img alt="" src="${IC(d.id,'macos')}" width="32" height="32"><img alt="" src="${IC(d.id,'macos')}" width="16" height="16"><img alt="" src="${IC(d.id,'android')}" width="40" height="40" style="margin-left:8px"><img alt="" src="${IC(d.id,'ios')}" width="40" height="40"></div>
    <div class="meta"><h3>${n}<span class="tag">${esc(tg(d.tag))}</span></h3><p>${esc(ds(d))}</p></div>
    <div class="bar-meter"><i style="width:${c/max*100}%"></i></div>
    <div class="row"><button class="btn vote" data-vote="${d.id}">${MINE.has(d.id)?t('voted'):t('vote')} · <span class="count">${c}</span></button><button class="btn" data-open="${d.id}">${t('preview')}</button></div>
  </article>`}).join('') || `<p class="empty">${t('empty')}</p>`;
  renderAll(); renderPodium();
}
function renderPodium(){
  const el=$('#podium'); if(!el) return; const tot=total();

  const top=[...ICONS].filter(d=>(COUNTS[d.id]||0)>0).sort((a,b)=>(COUNTS[b.id]||0)-(COUNTS[a.id]||0)||a.id.localeCompare(b.id,undefined,{numeric:true})).slice(0,3);
  const slot=(d,r)=> d ? `<div class="pod r${r}" data-open="${d.id}"><span class="rank">${r}</span><div class="art"><img alt="${esc(nm(d))}" src="${IC(d.id,'macos')}"></div><div class="pi"><h4>#${d.id} ${esc(nm(d))}</h4><div class="pv2"><b>${nv(COUNTS[d.id]||0)}</b><span>${t('res_share',{p:Math.round((COUNTS[d.id]||0)/Math.max(1,tot)*100)})}</span></div><div class="bar-meter"><i style="width:${(COUNTS[d.id]||0)/Math.max(1,tot)*100}%"></i></div></div></div>` : `<div class="pod r${r} wait"><span class="rank">${r}</span><div class="art"><span>?</span></div><div class="pi"><h4>${t('res_wait')}</h4></div></div>`;

    <div><h4>${t('f_project')}</h4><ul><li><a href="${REPO}" target="_blank" rel="noopener">GitHub</a></li><li><a href="${REPO}#readme" target="_blank" rel="noopener">${t('f_readme')}</a></li><li><a href="${REPO}/releases" target="_blank" rel="noopener">${t('f_releases')}</a></li><li><a href="${REPO}/issues" target="_blank" rel="noopener">${t('f_suggest')}</a></li></ul></div>
    <div><h4>${t('f_data')}</h4><ul><li><a href="dump.zip" download>dump.zip</a></li><li><a href="counts.json" target="_blank">counts.json</a></li><li><a href="${REPO}/blob/main/votes/counts.json" target="_blank" rel="noopener">${t('lk_ledger')}</a></li><li><a href="${REPO}/tree/main/icons" target="_blank" rel="noopener">${t('f_icons')}</a></li></ul></div>
    <div><h4>${t('f_more')}</h4><ul><li><a href="#concepts">${t('nav_concepts')}</a></li><li><a href="#dock">${t('nav_dock')}</a></li><li><a href="${REPO}/tree/main/shots" target="_blank" rel="noopener">${t('f_shots')}</a></li><li><a href="${REPO}/blob/main/LICENSE" target="_blank" rel="noopener">${t('lk_lic')}</a></li></ul></div>
  </div><div class="wrap"><div class="bottom"><span>${t('f_mit')} <a href="${REPO}/blob/main/LICENSE" target="_blank" rel="noopener">LICENSE</a></span><span>${t('f_legal')}</span></div></div></footer>
  <dialog id="pv"></dialog>`;
  $('#sort').onchange=e=>{SORT=e.target.value;renderCards()};
  $('#lang').onchange=async e=>{ const open=$('#pv').open?CUR:null; LANG=e.target.value; setCookie('vlclang',LANG); await loadLang(LANG); renderShell(); if(open) openPreview(open); };
  $('#theme').onclick=()=>{ const n=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=n; setCookie('vlctheme',n); };
  renderFilters(); renderCards(); renderStatus();
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-vote]'); if(v){ e.preventDefault(); toggleVote(v.dataset.vote); return; }
  const f=e.target.closest('[data-filter]'); if(f){ FILTER=f.dataset.filter; renderFilters(); renderCards(); if(f.tagName==='A') return; return; }
  const o=e.target.closest('[data-open]'); if(o) return openPreview(o.dataset.open);
  const p=e.target.closest('[data-plat]'); if(p) return openPreview(CUR,p.dataset.plat);
  const s=e.target.closest('[data-step]'); if(s){const i=ICONS.findIndex(x=>x.id===CUR);return openPreview(ICONS[(i+ +s.dataset.step+ICONS.length)%ICONS.length].id)}
  if(e.target.closest('[data-close]')||e.target.id==='pv') $('#pv').close();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.card')) return openPreview(e.target.dataset.open);
  if(!$('#pv')||!$('#pv').open) return; if(e.key==='ArrowRight')$('[data-step="1"]').click(); if(e.key==='ArrowLeft')$('[data-step="-1"]').click();
});

async function main(){
  ICONS = await (await fetch('icons.json')).json();
  if(params.get('shot')){ // screenshot mode used to export PNGs
    const id=params.get('shot'), d=ICONS.find(x=>x.id===id); document.body.className='shot'; document.documentElement.dataset.theme='dark';
    $('#app').innerHTML=`<div class="shotwrap"><div class="full" style="display:flex;gap:18px;align-items:center"><img src="${IC(id,'macos')}" width="84"><div><h2>VLC concept #${id} — ${esc(d.name)}</h2><p style="color:#A1A1AA;margin:4px 0 0">${esc(d.desc)}</p></div></div>
    <div class="full">${platHTML(id,'compare')}</div><div>${platHTML(id,'windows')}</div><div>${platHTML(id,'linux')}</div><div class="full">${platHTML(id,'phones')}</div></div>`;
    return;
  }
  await loadLang(LANG);
  renderShell(); await loadCounts(); renderCards();
  setInterval(async()=>{await loadCounts();renderCards()},20000);
}
main();
</script>
</body>
</html>
